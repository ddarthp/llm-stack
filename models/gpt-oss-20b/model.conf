# gpt-oss 20B en MXFP4, que es su formato nativo (no una cuantizacion posterior).
# Mezcla de expertos: 20B totales pero pocos activos por token.
NAME="gpt-oss 20B"
TAG="MXFP4 · razona"
MODEL="models/gpt-oss-20b-MXFP4.gguf"
CTX=32768
MIN_SIZE=11000000000
# Su generation_config.json no fija sampling; estos son los valores publicados
# por OpenAI para el modelo.
SAMPLING="--temp 1.0 --top-p 1.0 --top-k 0"
THINK="max"
