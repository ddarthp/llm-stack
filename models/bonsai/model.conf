# Bonsai 27B ternario. Unico modelo que NO usa llama.cpp estandar: la
# cuantizacion Q2_0 solo la lee el fork de PrismML, que ademas aporta el sesgo
# de mean-centering del KV.
NAME="Bonsai 27B"
TAG="Q2_0 · vision"
MODEL="models/Ternary-Bonsai-27B-Q2_0.gguf"
MMPROJ="models/Ternary-Bonsai-27B-mmproj-Q8_0.gguf"
CTX=150000
MIN_SIZE=6000000000
BIN="/home/deck/bonsai/bin"        # fork de PrismML, no el runtime comun
SAMPLING="--temp 0.7 --top-p 0.95 --top-k 20 --min-p 0"
THINK="512"

# KV a 4 bits: imprescindible para 150K de contexto. El sesgo recupera precision
# a coste cero, pero exige que la rotacion de K coincida con la calibracion.
_BIAS="/home/deck/bonsai/models/Ternary-Bonsai-27B-kv-bias.gguf"
EXTRA="-ctk q4_0 -ctv q4_0 --image-min-tokens 1024"
if [ -f "$_BIAS" ]; then
  EXTRA="$EXTRA --kv-mean-center $_BIAS"
  export LLAMA_ATTN_ROT_DISABLE=1
fi
_UI="/home/deck/bonsai/webui-config.json"
[ -f "$_UI" ] && EXTRA="$EXTRA --webui-config-file $_UI"
