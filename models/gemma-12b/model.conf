# Gemma 3 12B en su version QAT (quantization-aware training): a 4 bits conserva
# bastante mas calidad que una cuantizacion normal del mismo tamano.
NAME="Gemma 3 12B"
TAG="QAT Q4_0 · vision"
MODEL="models/gemma-3-12b-it-qat-Q4_0.gguf"
MMPROJ="models/mmproj-model-f16-12B.gguf"
CTX=32768
MIN_SIZE=6500000000
# Ajustes de la familia Gemma 3 (documentados en la ficha de Gemma 3n).
SAMPLING="--temp 1.0 --top-k 64 --top-p 0.95 --min-p 0.0"
# No es un modelo de razonamiento: THINK se deja vacio y no se pasa el flag.
