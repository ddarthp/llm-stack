# Agents-A1-4B — fine-tune de Qwen 3.5 4B orientado a agentes.
# Config replicada del video de Nichonauta (youtu.be/IDoL_A1VixA): llama.cpp
# estandar, sin MTP (el modelo no lo trae), sin cuantizar el KV, sin vision.
NAME="Qwen A1 4B"
TAG="Q8_0 · agente"
MODEL="models/Agents-A1-4B-Q8_0.gguf"
MMPROJ="models/Agents-A1-4B-mmproj.gguf"   # opcional: si no esta, se ignora
CTX=131072
MIN_SIZE=4000000000
# La ficha del fine-tune pide otros ajustes que el Qwen original.
SAMPLING="--temp 0.85 --top-p 0.95 --top-k 20 --min-p 0.0 --presence-penalty 1.1 --repeat-penalty 1.0"
THINK="max"
